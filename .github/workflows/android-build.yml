name: Build Santer AlFardous Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '**/*.zip'
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEY_BASE64: ${{ secrets.ALFARDOUS_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager not found in runner Android SDK'; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          if [ -f app/src/main/assets/index.html ]; then
            ROOT="."
          else
            mkdir -p /tmp/alfardous-unpack
            SOURCE_ZIP="$(find . -maxdepth 2 -type f -iname '*3.8.9*مصدر*مصحح*.zip' -print -quit)"
            if [ -z "$SOURCE_ZIP" ]; then SOURCE_ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"; fi
            if [ -z "$SOURCE_ZIP" ]; then echo 'No Android project ZIP found'; exit 1; fi
            DEST="/tmp/alfardous-unpack/$(basename "$SOURCE_ZIP" .zip)"
            mkdir -p "$DEST"
            unzip -oq "$SOURCE_ZIP" -d "$DEST"
            FOUND="$(find "$DEST" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
            if [ -n "$FOUND" ]; then ROOT="${FOUND%/app/src/main/assets/index.html}"; fi
          fi
          if [ -z "$ROOT" ]; then
            echo 'Android project not found. Check the source ZIP layout.'
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle"
      - name: Apply question bank import and startup repairs
        run: python3 ci/patch-3.8.10.py
      - name: Apply native Android contact picker repair
        run: python3 ci/patch-3.8.14-contact-picker.py
      - name: Apply memo and exam file upload repair
        run: python3 ci/patch-3.8.17-file-import.py
      - name: Allow three-part student names and finalize release metadata
        run: python3 ci/patch-3.8.16-three-name.py
      - name: Add native biometric and device-lock unlock
        run: python3 ci/patch-3.8.17-biometric.py
      - name: Diagnose account creation and biometric lock anchors
        run: python3 ci/diagnose-account-biometric.py
      - name: Run source regression tests
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/tests/feature-regression.test.cjs" || { echo 'Required source regression tests are missing'; exit 1; }
          cd "$PROJECT_ROOT"
          node --test tests/*.test.cjs
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          root = pathlib.Path(os.environ['PROJECT_ROOT'])
          html = (root / 'app/src/main/assets/index.html').read_text()
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          pathlib.Path('/tmp/alfardous-inline-js').mkdir(exist_ok=True)
          for i, source in enumerate(scripts):
              pathlib.Path(f'/tmp/alfardous-inline-js/{i}.js').write_text(source)
          print(f'Extracted {len(scripts)} inline scripts')
          PY
          for file in /tmp/alfardous-inline-js/*.js; do node --check "$file"; done
      - name: Configure secure release signing
        id: signing
        if: ${{ env.RELEASE_KEY_BASE64 != '' }}
        env:
          ALFARDOUS_KEYSTORE_PASSWORD: ${{ secrets.ALFARDOUS_KEYSTORE_PASSWORD }}
          ALFARDOUS_KEY_ALIAS: alfardous-center
          ALFARDOUS_KEY_PASSWORD: ${{ secrets.ALFARDOUS_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AlFerdousCenter-release.jks"
          printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          test -s "$KEY_PATH"
          echo "Checking release keystore format and alias..."
          if ! keytool -list -storetype PKCS12 -keystore "$KEY_PATH" -storepass "$ALFARDOUS_KEYSTORE_PASSWORD" -alias "$ALFARDOUS_KEY_ALIAS" >/tmp/alfardous-key-check.log 2>&1; then
            echo "Keystore validation failed. Diagnostic (secrets omitted):"
            cat /tmp/alfardous-key-check.log
            exit 1
          fi
          echo "Release keystore and alias validated."
          echo "ALFARDOUS_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          python3 - "$PROJECT_ROOT/app/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if "signingConfigs {" not in s:
              s += """

          // Release signing added by CI; secrets are read only from environment.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ALFARDOUS_KEYSTORE_PATH'))
                      storeType 'PKCS12'
                      storePassword System.getenv('ALFARDOUS_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ALFARDOUS_KEY_ALIAS')
                      keyPassword System.getenv('ALFARDOUS_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          """
              p.write_text(s)
          PY
          echo "Private signing key configured without adding it to the repository."
      - name: Build signed release APK
        if: ${{ env.RELEASE_KEY_BASE64 != '' && steps.signing.outcome == 'success' }}
        env:
          ALFARDOUS_KEYSTORE_PASSWORD: ${{ secrets.ALFARDOUS_KEYSTORE_PASSWORD }}
          ALFARDOUS_KEY_ALIAS: alfardous-center
          ALFARDOUS_KEY_PASSWORD: ${{ secrets.ALFARDOUS_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon -p "$PROJECT_ROOT" clean :app:assembleRelease
      - name: Verify APK signature and app identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          sed -n '1p' "$RUNNER_TEMP/apk-badging.txt"
      - name: Launch APK on Android emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 4
          script: |
            set -euo pipefail
            APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            adb install -r "$APK"
            adb shell am start -n eg.alfardous.center.fresh/eg.alfardous.center.MainActivity
            sleep 12
            adb shell pidof eg.alfardous.center.fresh >/dev/null
            adb shell screencap -p /sdcard/alfardous-3.8.15-screen.png
            adb pull /sdcard/alfardous-3.8.14-screen.png ./alfardous-3.8.14-screen.png
      - name: Upload final signed APK only after emulator smoke test
        if: ${{ success() && env.RELEASE_KEY_BASE64 != '' && steps.signing.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: santer-alfardous-3.8.15-release
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload emulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: santer-alfardous-3.8.15-emulator-smoke
          path: alfardous-3.8.14-screen.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload signed release APK
        if: ${{ success() && env.RELEASE_KEY_BASE64 != '' && steps.signing.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: santer-alfardous-3.8.15-release
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build debug APK (verification only)
        if: ${{ env.RELEASE_KEY_BASE64 == '' }}
        run: gradle --no-daemon -p "$PROJECT_ROOT" clean :app:assembleDebug
      - name: Upload debug APK for verification only
        if: ${{ env.RELEASE_KEY_BASE64 == '' || steps.signing.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: santer-alfardous-3.8.15-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
